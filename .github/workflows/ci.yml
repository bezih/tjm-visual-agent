name: ci
on:
  push:
  pull_request:
jobs:
  test:
    # Unit tests only: no models, no desktop, no API key. Live desktop runs are reported
    # separately in docs/evaluation.md and are never implied by this badge.
    runs-on: macos-14  # arm64; the locked environment includes MLX and pyobjc
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked pytest
