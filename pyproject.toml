[project]
name = "tjm-agent"
version = "0.1.0"
description = "ScreenSeekeR-based visual grounding for desktop automation (macOS adaptation)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "mlx-vlm>=0.3",
    "pillow>=10",
    "mss>=9",
    "pyautogui>=0.9.54",
    "pydantic>=2",
    "python-dotenv>=1",
    "httpx>=0.27",
    "pyobjc-framework-applicationservices>=10",
]

[project.scripts]
tjm-agent = "tjm_agent.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tjm_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs a real macOS desktop, permissions and model access (opt-in)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
